    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */

            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;

            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <h1>Week 6 Tuesday Practice Quiz</h1>

    <div id="quiz-container">

    <script>
        const quizData = [
    {
        learningObjective: "LO 1.1 (Overview of the Immune System): Describe the main purposes of the immune system and how clinical disease results when immune responses are inappropriate. (USMLE 1.B., 1.C.)",
        question: "A 34-year-old woman presents with a facial rash that worsens with sun exposure, joint pain, and fatigue. Laboratory studies show anti-nuclear antibodies (ANA) and anti-double-stranded DNA (anti-dsDNA) antibodies. This patient's condition is a classic example of which type of immunological dysfunction?",
        options: { 
            A: "A lack of response, leading to immunodeficiency", 
            B: "An appropriate response to a foreign pathogen", 
            C: "An inappropriate response to self-antigens, leading to autoimmunity", 
            D: "A complete failure of the innate immune system" 
        },
        correctAnswer: "C",
        rationale: "The patient's presentation is characteristic of systemic lupus erythematosus (SLE), an autoimmune disease. The presence of autoantibodies (ANA, anti-dsDNA) indicates that her adaptive immune system is mounting an inappropriate attack against her own cellular components ('self-antigens'), leading to inflammation and tissue damage (immunopathology).",
        source: "'Inappropriate response: immunopathology (e.g., allergy, autoimmunity)' (Immunology Slides, Page 21)"
    },
    {
        learningObjective: "LO 1.1 (Overview of the Immune System): Describe the main purposes of the immune system and how clinical disease results when immune responses are inappropriate. (USMLE 1.B., 1.C.)",
        question: "A 25-year-old man presents with his third episode of bacterial pneumonia in the past year. He also has a history of recurrent sinus infections. Laboratory evaluation reveals significantly low levels of IgG, IgA, and IgM. This patient's susceptibility to infections is most likely due to which type of immunological problem?",
        options: { 
            A: "Autoimmunity", 
            B: "Immunopathology due to an overactive response", 
            C: "Immune tolerance to a pathogen", 
            D: "Immunodeficiency due to a lack of response" 
        },
        correctAnswer: "D",
        rationale: "The patient's history of recurrent bacterial infections and low levels of all major antibody isotypes are hallmarks of an immunodeficiency, specifically Common Variable Immunodeficiency (CVID). This condition represents a 'lack of response' from the adaptive immune system, specifically the B cells' ability to produce antibodies, leading to an inability to effectively clear certain pathogens.",
        source: "'Lack of response: immunodeficiency (e.g., common variable immunodeficiency, HIV-1 disease)' (Immunology Slides, Page 21)"
    },
    {
        learningObjective: "LO 1.1 (Overview of the Immune System): Describe the main purposes of the immune system and how clinical disease results when immune responses are inappropriate. (USMLE 1.B., 1.C.)",
        question: "A patient develops a severe skin rash, wheezing, and hypotension minutes after being stung by a bee. This rapid and life-threatening reaction is an example of an inappropriate immune response to a harmless environmental substance. This type of immunopathology is best classified as which of the following?",
        options: { 
            A: "An autoimmune response", 
            B: "A delayed-type hypersensitivity reaction", 
            C: "An allergic or immediate hypersensitivity reaction", 
            D: "An immunodeficient state" 
        },
        correctAnswer: "C",
        rationale: "The patient is experiencing anaphylaxis, a severe Type I (immediate) hypersensitivity reaction. This is a form of immunopathology where the immune system mounts an excessive and damaging response to a typically harmless foreign substance (an allergen). This is considered an 'inappropriate response' because the response itself, not the bee venom, is the primary cause of life-threatening pathology.",
        source: "'Inappropriate response: immunopathology (e.g., allergy, autoimmunity)' (Immunology Slides, Page 21)"
    },
    {
        learningObjective: "LO 1.2 (Overview of the Immune System): Explain how the immune system detects and responds to danger signals. (USMLE 1.B.10.)",
        question: "A 45-year-old man presents with fever, cough, and shortness of breath. A chest X-ray reveals a lobar pneumonia, and sputum culture grows Streptococcus pneumoniae. The initial, rapid inflammatory response in his lungs is triggered by innate immune cells recognizing molecular structures common to this class of bacteria, such as peptidoglycan. These bacterial structures are best described as which of the following?",
        options: { 
            A: "Self-antigens", 
            B: "Pathogen-associated molecular patterns (PAMPs)", 
            C: "Damage-associated molecular patterns (DAMPs)", 
            D: "Antibodies" 
        },
        correctAnswer: "B",
        rationale: "PAMPs are conserved molecular structures found on foreign substances like pathogenic bacteria and viruses but are not normally present in the human body. Innate immune cells use pattern-recognition receptors (PRRs) to detect these PAMPs, which serves as the primary 'danger signal' to initiate an immune response.",
        source: "'PRRs nonspecifically recognize molecular patterns called PAMPs (pathogen-associated molecular patterns)...' (Immunology Slides, Page 38)"
    },
    {
        learningObjective: "LO 1.2 (Overview of the Immune System): Explain how the immune system detects and responds to danger signals. (USMLE 1.B.10.)",
        question: "A 60-year-old man suffers a myocardial infarction. The ischemic injury to the cardiac tissue causes widespread cell death and the release of intracellular contents, such as ATP and mitochondrial DNA, into the extracellular space. These endogenous molecules trigger a sterile inflammatory response that contributes to tissue repair but also to further damage. These released 'self' molecules that signal tissue injury are known as which of the following?",
        options: { 
            A: "Pathogen-associated molecular patterns (PAMPs)", 
            B: "Commensal-associated molecular patterns (CAMPs)", 
            C: "Damage-associated molecular patterns (DAMPs)", 
            D: "Immunoglobulins" 
        },
        correctAnswer: "C",
        rationale: "DAMPs are endogenous molecules released from damaged or dying cells that signal a 'danger' to the immune system, initiating a non-infectious, or sterile, inflammatory response. This is a crucial mechanism for detecting tissue injury and initiating repair, but it can also contribute to pathology in conditions like myocardial infarction or trauma.",
        source: "'...or (more generally) DAMPs (damage-associated molecular patterns)' (Immunology Slides, Page 38)"
    },
    {
        learningObjective: "LO 1.2 (Overview of the Immune System): Explain how the immune system detects and responds to danger signals. (USMLE 1.B.10.)",
        question: "A patient with a rapidly growing melanoma is treated with an immune checkpoint inhibitor. This therapy is designed to enhance the ability of the patient's own T cells to recognize and attack the cancer cells. The fundamental principle underlying this therapy is that the immune system can be trained to overcome its tolerance to certain 'self' cells that have become dangerous. This process is known as:",
        options: { 
            A: "Immunopathology", 
            B: "Immunosurveillance", 
            C: "Immune privilege", 
            D: "Commensalism" 
        },
        correctAnswer: "B",
        rationale: "Immunosurveillance is the concept that the immune system constantly patrols the body to identify and eliminate malignant cells. Cancer cells, while derived from 'self', express altered proteins that can be recognized as danger signals. The traditional 'self vs. non-self' paradigm fails to account for this critical function.",
        source: "'The body sometimes needs to recognize and get rid of certain “self” cells (e.g., cancer)' and 'Doesn't work for: –Immunosurveillance (e.g., tumor immunology)' (Immunology Slides, Pages 25 & 26)"
    },
    {
        learningObjective: "LO 1.3 (Overview of the Immune System): List the main components of the innate and adaptive immune systems. (USMLE 1.B.1-9.)",
        question: "A newborn is diagnosed with DiGeorge syndrome due to a 22q11.2 deletion, resulting in the absence of a thymus. This infant will have a profound deficiency in the maturation of which of the following cell types, leading to a severe defect in cell-mediated immunity?",
        options: { 
            A: "B cells", 
            B: "Neutrophils", 
            C: "T cells", 
            D: "Natural killer (NK) cells" 
        },
        correctAnswer: "C",
        rationale: "The thymus is a primary lymphoid organ that is the essential site for the development and maturation of T cells. While T cell precursors originate in the bone marrow, they must migrate to the thymus to become functional. Without a thymus, T cell development is arrested, resulting in a severe T cell immunodeficiency.",
        source: "'Primary -Bone marrow... B cells develop here) -Thymus (T cells develop here)' and Clinical Correlation: 'If the thymus is absent, there is no T cell immunity.' (Immunology Slides, Pages 33 & 34)"
    },
    {
        learningObjective: "LO 1.3 (Overview of the Immune System): List the main components of the innate and adaptive immune systems. (USMLE 1.B.1-9.)",
        question: "A 5-year-old child presents with a skin laceration that becomes red, swollen, and warm within hours. A complete blood count shows a high neutrophil count. These neutrophils are rapidly recruited to the site of injury to engulf bacteria. Neutrophils are a key cellular component of which branch of the immune system?",
        options: { 
            A: "The adaptive immune system", 
            B: "The humoral immune system", 
            C: "The innate immune system", 
            D: "The secondary lymphoid system" 
        },
        correctAnswer: "C",
        rationale: "Neutrophils are phagocytic cells that form the first line of defense against bacterial infections. They are a critical component of the innate immune system, which is characterized by its rapid, non-specific response to pathogens. Their presence and action within hours of an injury is a hallmark of an innate immune response.",
        source: "'Components - Cells (e.g., neutrophils, monocytes/macrophages, dendritic cells, innate lymphoid cells (ILCs) including natural killer (NK) cells' (Immunology Slides, Page 37)"
    },
    {
        learningObjective: "LO 1.3 (Overview of the Immune System): List the main components of the innate and adaptive immune systems. (USMLE 1.B.1-9.)",
        question: "A patient receives a tetanus booster vaccine. Several weeks later, her blood is tested and found to have high levels of tetanus-specific IgG antibodies. These antibodies are produced by plasma cells, which are terminally differentiated versions of which of the following cells?",
        options: { 
            A: "T cells", 
            B: "B cells", 
            C: "Dendritic cells", 
            D: "Macrophages" 
        },
        correctAnswer: "B",
        rationale: "B cells (B lymphocytes) are the key cellular component of the humoral adaptive immune system. Upon encountering a specific antigen and receiving help from T cells, B cells become activated, proliferate, and differentiate into plasma cells, which are specialized factories for producing and secreting large quantities of antibodies.",
        source: "'Components - Cells (T cells, B cells, plasma cells, others)... Antibody produced following B cell activation' (Immunology Slides, Page 41)"
    },
    {
        learningObjective: "LO 1.4 (Overview of the Immune System): Compare and contrast the innate and adaptive immune systems. (USMLE 1.B.1-9.)",
        question: "A 10-year-old boy recovers from a measles infection. Two years later, he is exposed to the measles virus again but does not develop any symptoms. His protection against reinfection is primarily due to a feature that is unique to the adaptive immune system. Which of the following features is responsible for this protection?",
        options: { 
            A: "Rapid response time (seconds to hours)", 
            B: "Recognition of PAMPs", 
            C: "Immunological memory", 
            D: "Use of phagocytic cells" 
        },
        correctAnswer: "C",
        rationale: "A hallmark feature of the adaptive immune system is the generation of immunological memory. The primary immune response to measles created long-lived memory B cells and T cells. Upon secondary exposure, these memory cells mount a faster, stronger, and more effective response that eliminates the virus before it can cause disease. The innate immune system lacks this memory feature.",
        source: "'Features... On subsequent exposure (secondary immune response), immunological memory allows a response to occur seconds following exposure' (Immunology Slides, Page 42) and 'Memory - Present, and improves with reexposure' (Immunology Slides, Page 44)"
    },
    {
        learningObjective: "LO 1.4 (Overview of the Immune System): Compare and contrast the innate and adaptive immune systems. (USMLE 1.B.1-9.)",
        question: "The receptors used by the innate immune system, such as Toll-like receptors (TLRs), differ fundamentally from the receptors used by the adaptive immune system (TCRs and BCRs). Which of the following statements best describes a key difference in the genetics of these receptors?",
        options: { 
            A: "Innate receptors are produced by gene rearrangement, while adaptive receptors are encoded directly in the germline.", 
            B: "Innate receptors are encoded directly in the germline, while adaptive receptors are produced by gene rearrangement.", 
            C: "Both innate and adaptive receptors are encoded directly in the germline.", 
            D: "Both innate and adaptive receptors are produced by gene rearrangement." 
        },
        correctAnswer: "B",
        rationale: "Innate immune receptors (PRRs like TLRs) are encoded directly in the germline DNA, resulting in a limited number of stereotyped receptors. In contrast, the vast diversity of adaptive immune receptors (B cell and T cell receptors) is generated during lymphocyte development through a unique process of somatic recombination (gene rearrangement) of gene segments.",
        source: "'Genetics - Encoded directly in germline DNA [Innate] vs. Produced by gene rearrangement, recombination, hypermutation [Adaptive]' (Immunology Slides, Page 44)"
    },
    {
        learningObjective: "LO 1.4 (Overview of the Immune System): Compare and contrast the innate and adaptive immune systems. (USMLE 1.B.1-9.)",
        question: "A patient presents with a small cut on their finger that occurred 4 hours ago. The area is already red and slightly swollen. This initial, rapid response is characteristic of the innate immune system. Which of the following correctly describes the timing of the innate versus a primary adaptive immune response?",
        options: { 
            A: "Innate: days to weeks; Adaptive: seconds to hours", 
            B: "Innate: seconds to hours; Adaptive: days to weeks", 
            C: "Both systems respond within seconds to hours.", 
            D: "Both systems require days to weeks to respond." 
        },
        correctAnswer: "B",
        rationale: "The innate immune system is pre-programmed and acts very quickly, within seconds to hours of encountering a pathogen. The adaptive immune system, when encountering a pathogen for the first time (a primary response), requires a period of clonal selection, expansion, and differentiation, which takes days to weeks to become fully effective.",
        source: "'Timing - Seconds-hours [Innate] vs. Primary: days-weeks Secondary: seconds-hours [Adaptive]' (Immunology Slides, Page 44)"
    },
    {
        learningObjective: "LO 1.5 (Overview of the Immune System): Describe what happens as an immune response subsides. (USMLE 1.C.6.)",
        question: "A patient is recovering from a severe bacterial infection. As the pathogen is cleared, the systemic inflammatory response begins to resolve. Which of the following events is a key step in the subsidence of this acute immune response?",
        options: { 
            A: "A surge in pro-inflammatory cytokine production", 
            B: "Apoptosis of most effector plasma cells and T-helper cells", 
            C: "Increased chemotaxis of neutrophils to the site of infection", 
            D: "Downregulation of anti-inflammatory T-helper cells" 
        },
        correctAnswer: "B",
        rationale: "As the danger signals (pathogens) are eliminated, the activating signals for lymphocytes decrease. To prevent prolonged inflammation and tissue damage, the vast majority of the short-lived effector cells, including plasma cells and pro-inflammatory T-helper cells, undergo programmed cell death (apoptosis). A small subset is retained as memory cells.",
        source: "'Activating signals for B cells decrease and most plasma cells die by apoptosis' and 'Pro-inflammatory T-helper cells undergo apoptosis and anti-inflammatory T-helper cells take over' (Immunology Slides, Page 52)"
    },
    {
        learningObjective: "LO 1.5 (Overview of the Immune System): Describe what happens as an immune response subsides. (USMLE 1.C.6.)",
        question: "Following the resolution of a localized skin abscess, the area undergoes healing and tissue repair. Which cell type is primarily responsible for clearing dead neutrophils, pathogens, and cellular debris, as well as initiating the repair process?",
        options: { 
            A: "B lymphocytes", 
            B: "Cytotoxic T lymphocytes", 
            C: "Neutrophils", 
            D: "Macrophages" 
        },
        correctAnswer: "D",
        rationale: "After the acute phase of inflammation, macrophages play a crucial 'cleanup' and 'repair' role. They phagocytose dead cells (like neutrophils that have formed pus) and debris. They also signal local cells and recruit specialized wound-healing cells to begin the process of tissue repair and remodeling.",
        source: "'Macrophages eat dead pathogens and tissues, signal local cells to initiate repair, and signal special wound-healing cells to enter the damaged tissue' (Immunology Slides, Page 51)"
    },
    {
        learningObjective: "LO 1.5 (Overview of the Immune System): Describe what happens as an immune response subsides. (USMLE 1.C.6.)",
        question: "After a viral infection is cleared, most of the effector cells die off, but a small population of antibody-producing cells is maintained long-term in the lymphatic system. These cells are ready to produce antibodies quickly upon re-exposure to the same virus. What is the identity of these long-lived cells?",
        options: { 
            A: "Naive B cells", 
            B: "Memory T cells", 
            C: "Long-lived plasma cells", 
            D: "Natural killer (NK) cells" 
        },
        correctAnswer: "C",
        rationale: "While most plasma cells produced during an acute response are short-lived, a subset migrates to specific niches, such as the bone marrow or other lymphatic tissues. Here, they receive survival signals that allow them to live for long periods, continuously secreting low levels of antibody and providing a rapid source of protection upon re-exposure.",
        source: "'Some plasma cells go to the lymphatic system where they receive signals to keep them alive for a long period, making them ready for the next exposure to the same organism' (Immunology Slides, Page 52)"
    },
    {
        learningObjective: "LO 2.1 (Basics of Innate Immunity I): Describe major cells involved in innate immune responses, and know their roles. (USMLE 1.B.)",
        question: "A 4-year-old boy presents with multiple skin abscesses. A sample from an abscess grows Staphylococcus aureus. Further workup reveals that his neutrophils can migrate to the site of infection and phagocytose bacteria, but they are unable to kill the ingested organisms due to a defect in generating reactive oxygen species. Which cell type is primarily dysfunctional in this patient?",

            B: "Macrophages", 
            C: "Neutrophils", 
            D: "Dendritic cells" 
        },

        rationale: "The patient's presentation is classic for Chronic Granulomatous Disease (CGD). This disorder is characterized by a defect in NADPH oxidase within neutrophils (and other phagocytes), which prevents the 'respiratory burst' needed to produce reactive oxygen species for killing ingested pathogens like S. aureus. Neutrophils are the key cell type with the functional defect.",
        source: "'Neutrophils... Ingestion by phagocytosis, then comes killing.' (Immunology Slides, Page 8) and 'Neutrophil Killing' (Immunology Slides, Page 39)"
    },
    {
        learningObjective: "LO 2.1 (Basics of Innate Immunity I): Describe major cells involved in innate immune responses, and know their roles. (USMLE 1.B.)",
        question: "A patient with a viral infection is found to have an increased number of lymphocytes that can recognize and kill virus-infected cells without prior sensitization. These cells are identified by their ability to destroy target cells that have downregulated MHC class I expression. Which of the following is the most likely identity of these cytotoxic cells?",
        options: { 
            A: "Basophils", 
            B: "Eosinophils", 
            C: "B cells", 
            D: "Natural killer (NK) cells" 
        },
        correctAnswer: "D",
        rationale: "Natural killer (NK) cells are a type of innate lymphoid cell that plays a crucial role in early defense against viral infections and tumors. A key mechanism of their function is recognizing and killing cells that have lost MHC class I expression, a common strategy used by viruses and cancer cells to evade T-cell mediated immunity.",
        source: "'NK cells can recognize and destroy virus-infected cells...' and 'Virus-infected cells express less MHC Class 1 on their surface' (Immunology Slides, Pages 4 & 5)"
    },
    {
        learningObjective: "LO 2.1 (Basics of Innate Immunity I): Describe major cells involved in innate immune responses, and know their roles. (USMLE 1.B.)",
        question: "A tissue sample from an inflamed area shows large phagocytic cells containing cellular debris and bacteria. These cells not only serve as 'garbage collectors' but also produce pro-inflammatory cytokines and can present antigens to T cells to initiate an adaptive immune response. Which cell type best fits this description?",
        options: { 
            A: "Mast cells", 
            B: "Neutrophils",

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;
                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }

            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';

            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                 feedbackHTML = `<span class="feedback-status">Incorrect.</span> The correct answer is ${qData.correctAnswer}.`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
